{{define "content"}}
<article aria-labelledby="home-title">
  <header>
    <small class="section-label">Library</small>
    <h1 id="home-title">{{.SiteTitle}}</h1>
  </header>

  {{if .Projects}}
  <ul class="project-list">
    {{range .Projects}}
    <li>
      <a class="project-item__title" href="/{{esc .Slug}}/">{{.Title}}</a>
      <p class="series-byline">by {{.Author}}</p>
      {{if .Blurb}}<p class="series-description">{{.Blurb}}</p>{{end}}
      <small class="project-item__meta">{{len .Pages}} pages</small>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty-state">No projects found.</p>
  {{end}}
</article>
{{end}}
