<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/pico.classless.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      {{if .ProjectSlug}}<a class="site-header__back" href="/">← All series</a>{{end}}
      <a class="site-header__brand" href="/">{{.SiteTitle}}</a>
      <span class="site-header__context">English translation</span>
    </div>
  </header>
  <main class="shell" id="main-content">
    {{template "content" .}}
  </main>
</body>
</html>
